<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">

</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginform" action="index.html">
            <div class="form-grp">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-grp">      
                <label for="password">password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('loginform');
        form.addEventListener('submit',function(event){
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if(username=='bhai'&&password=='bhai'){
                form.reset();
    
                setTimeout(function() {
                    window.location.href = 'index.html'; 
                }, 500);
            
            }

            else{
                alert('login failed')
                form.reset();
            }
        
        });
        function navigate(){
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
